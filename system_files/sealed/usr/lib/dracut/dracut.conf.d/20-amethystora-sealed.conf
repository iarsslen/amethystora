# The initramfs of a sealed image's UKI (build_files/sealed/00-sealed.sh adds bootc's module to it)
# Source: https://github.com/travier/fedora-atomic-desktops-sealed (CC0-1.0)

# The accounts are in /usr/lib/passwd and /usr/lib/group (nss-altfiles), https://issues.redhat.com/browse/RHEL-49590
install_items+=" /usr/lib/passwd /usr/lib/group "

# What a desktop installed by amethystora-install-sealed does not boot from, or does not boot with: FIPS
# (Fedora does not support it), SAS LUN masking, LVM (the installer uses a plain partition), memstrack
# (a debugging aid), module signing keys and NSS. The smaller the UKI, the sooner the firmware has
# checked its signature.
omit_dracutmodules+=" fips fips-crypto-policies lunmask lvm memstrack modsign nss-softokn "
