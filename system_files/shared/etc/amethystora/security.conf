# Amethystora security settings. Change them with `ujust security-settings`, which also applies them.
# Edited by hand, they apply at the next restart. Only /usr/libexec/amethystora-security-config reads
# this file, so a value it does not know counts as the default rather than as a mistake.

# What happens to a file a virus scan finds: the weekly scan, the scans started from the Security app,
# and real-time scanning.
#   report      Say so, and leave the file where it is. A match can be a false positive.
#   quarantine  Move it to /var/lib/amethystora/quarantine, where nothing can open or run it.
#               `ujust virus-scan restore` puts it back.
#   delete      Delete it.
ON_DETECTION=report

# Real-time watching.
#   off  The security watcher looks every 15 minutes, and the virus scan runs weekly.
#   on   The watcher looks the moment the audit log records a change it watches, and every file
#        written in a home folder is scanned for viruses as it is closed. Costs some CPU while
#        files are being written.
REALTIME=off

# Network protection: Suricata inspecting this machine's own connections against Emerging Threats Open.
#   off    Nothing is inspected.
#   watch  Every connection is inspected, and what Suricata recognises is said. Nothing is blocked.
#   block  As watch, and connections to known malware, command servers and exploits are cut off.
#          `ujust blocked-connections` shows them, and allows one again.
# Whatever goes wrong with it, connections go on uninspected rather than stop.
NETWORK=off
