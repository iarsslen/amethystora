# Amethystora security settings. Change them with `ame security settings`, or on the Settings page of the
# Security app, which also apply them. Only /usr/libexec/amethystora-security-config reads this file, so a
# value it does not know counts as the default rather than as a mistake.
#
# Every security feature that runs without being asked for has a key here, and off means it costs nothing.
# Edited by hand, a line takes effect at the next restart: each service reads its key as it starts, so this
# works from a text console even when the desktop does not start. `ame security profile off` turns every
# key that can be off to off, and `ame security profile default` puts each back to what is written below.

# What happens to a file a virus scan finds: the weekly scan, the scans started from the Security app,
# and real-time scanning.
#   report      Say so, and leave the file where it is. A match can be a false positive.
#   quarantine  Move it to /var/lib/amethystora/quarantine, where nothing can open or run it.
#               `ame security scan restore` puts it back.
#   delete      Delete it.
ON_DETECTION=report

# Real-time watching and scanning, both at once. Each half can be set on its own below, and follows this
# until it is.
#   off  The security watcher looks every 15 minutes, and the virus scan runs weekly.
#   on   The watcher looks the moment the audit log records a change it watches, and every file
#        written in a home folder is scanned for viruses as it is closed. Costs some CPU while
#        files are being written.
REALTIME=off
#REALTIME_WATCH=off   off or on: reading audit events as they happen
#REALTIME_SCAN=off    off or on: scanning each file written in a home folder as it is closed

# Network protection: Suricata inspecting this machine's own connections against Emerging Threats Open.
#   off    Nothing is inspected.
#   watch  Every connection is inspected, and what Suricata recognises is said. Nothing is blocked.
#   block  As watch, and connections to known malware, command servers and exploits are cut off.
#          `ame security connections` shows them, and allows one again.
# Whatever goes wrong with it, connections go on uninspected rather than stop.
NETWORK=off

# The virus scanner (ClamAV).
#   off     Nothing runs: no daemon holding the signatures in memory, no downloads, no scans.
#   manual  The signatures are kept up to date, and scans run when you start one.
#   weekly  And every Sunday, the home and temporary folders.
#VIRUS_SCAN=weekly

# The monthly Lynis audit of the settings: off or on. `ame security audit` runs one either way.
#SETTINGS_AUDIT=on

# The security watcher, every 15 minutes: off or on. Off, none of the keys it reads below acts.
#WATCHER=on

# The audit log (auditd and its rules): off or on, from the next restart.
#AUDIT_LOG=on

# What the watcher reads, each on its own. off: not read, and from the next restart for the audit log's
# keys, not recorded either. record: kept in the history without a notification. on: said.
#IDENTITY=on        accounts and passwords
#PRIVILEGE=on       who may use sudo, and the administrator rules
#PERSISTENCE=on     what starts by itself
#HARDENING=on       the security settings, these included
#MODULES=on         kernel modules loaded or removed from a login
#INPUT_CAPTURE=on   programs reading the keyboard directly
#USER_PROGRAMS=record   commands and launchers added to a home folder
#JOURNAL=on         accounts locked, wrong passwords, blocked USB devices
#LISTENERS=on       programs accepting connections from other machines
#USER_PATHS=on      commands named like the system's in a home folder, and launchers no container made
# off or on:
#IMAGE_DRIFT=on     /etc compared with the image's own copy
#SETUID_SWEEP=on    the daily search for setuid programs outside the image
#REPORT_ALERTS=on   saying when a check of the report turns bad

# What is said out loud: all, critical (only the critical findings), or none. Everything is still in the
# report, the history and `ame security events`.
#NOTIFY=all
