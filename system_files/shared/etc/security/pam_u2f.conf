# Defaults for every pam_u2f line (authselect's system-auth and password-auth, and the DMS lock screen).
# Security keys are bound to a fixed identifier rather than the default pam://$HOSTNAME, so they keep
# working when the hostname changes (DHCP, renaming the computer). `ujust setup-security-key` registers
# keys with the same value: changing it invalidates every registered key.
origin = pam://amethystora
appid = pam://amethystora
