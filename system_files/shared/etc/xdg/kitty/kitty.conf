# Amethystora defaults for kitty. kitty reads this only when ~/.config/kitty/kitty.conf does not
# exist; a config of your own replaces it whole, so add the include line below to keep following
# the desktop theme.

font_family JetBrains Mono
font_size 11.0
window_padding_width 8
# GNOME draws no server-side decorations; kitty's own title bar follows the theme's colours
wayland_titlebar_color background
confirm_os_window_close 0
enable_audio_bell no

# The palette amethystora-theme renders for the current theme, reloaded on every switch
include ~/.config/amethystora/current/theme/kitty.conf
