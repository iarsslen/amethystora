# The image's own firewalld action for fail2ban (jail.d/10-amethystora.conf). Fail2ban's
# firewallcmd-rich-rules adds its rule to firewalld's default zone alone, whatever zone a jail names, and
# Amethystora's networks are in three: amethystora, the default; amethystora-home, the networks named home;
# and amethystora-away, every other network while `ame security firewall-away` is on. This bans in each,
# so that an address is refused whichever network it comes from.
[INCLUDES]
before = firewallcmd-rich-rules.conf

[Definition]
actionban = ports="<port>"; for z in <zones>; do for p in $(echo $ports | tr ":, " "- "); do firewall-cmd --zone=$z --add-rich-rule="%(fwcmd_rich_rule)s"; done; done
actionunban = ports="<port>"; for z in <zones>; do for p in $(echo $ports | tr ":, " "- "); do firewall-cmd --zone=$z --remove-rich-rule="%(fwcmd_rich_rule)s"; done; done

[Init]
zones = amethystora amethystora-home amethystora-away
