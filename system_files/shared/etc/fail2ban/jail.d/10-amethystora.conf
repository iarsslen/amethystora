# Fail2ban on Amethystora: too many failed logins from one address, and firewalld rejects that
# address for a while. Set up in build_files/base/08-hardening.sh, which also sets the firewall zone
# named below. Drop another file in this directory to add jails of your own; do not edit jail.conf.
#
# This is about the address. pam_faillock (/etc/security/faillock.conf) separately locks the account
# itself after ten wrong passwords, wherever they were typed.

[DEFAULT]
# Nothing here logs to a file: sshd's log lives in the journal only.
backend = systemd

# Ban in every zone a network here can be in: amethystora, which 08-hardening.sh makes the default,
# amethystora-home for the networks named home, and amethystora-away. Fail2ban's own firewalld action
# bans in the default zone alone, whatever zone it is told, and a rule in a zone the network's interface
# is not in never matches anything, so the ban would silently do nothing (action.d/amethystora-zones.conf).
# Tailscale is in the trusted zone and is not covered: who may reach this machine over the tailnet
# is decided by the tailnet's access rules.
banaction = amethystora-zones[actiontype=<multiport>]
banaction_allports = amethystora-zones[actiontype=<allports>]

# Five failures within ten minutes cost an hour, and each further ban of the same address lasts
# longer than the last, up to a day.
maxretry = 5
findtime = 10m
bantime = 1h
bantime.increment = true
bantime.maxtime = 1d

# This machine is never banned. The tailnet needs no exception: a ban is made in the Amethystora zones,
# and the tailnet is in the trusted one. Tailscale's ranges are left out here on purpose, since they
# are also what carrier-grade NAT, hotspots and some offices hand out, whose hosts would never be banned.
ignoreself = true
ignoreip = 127.0.0.1/8 ::1

# The SSH server is off until someone turns it on (`sudo systemctl enable --now sshd`), and the
# firewall rejects everything else, so this is the only jail that has anything to watch.
[sshd]
enabled = true
# jail.conf's own [sshd] sets a backend, which would otherwise win over the one in [DEFAULT].
backend = systemd
