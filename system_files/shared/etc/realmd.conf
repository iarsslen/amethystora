# Amethystora's realmd settings, for Settings' Enterprise Login and `realm join`. realmd reads this file
# after its own and Fedora's, and a value here replaces theirs.

[service]
# Name a missing package in the error instead of asking PackageKit, which this image does not have. The
# image has what an Active Directory domain needs; FreeIPA's client is layered (faq.md).
automatic-install = no

[commands]
# realmd's own run `authselect select sssd with-mkhomedir --force`, which turns off account lockout,
# fingerprint login and security keys. These keep the image's authselect features.
sssd-enable-logins = /usr/libexec/amethystora-domain-logins sssd
sssd-disable-logins = /usr/libexec/amethystora-domain-logins image
winbind-enable-logins = /usr/libexec/amethystora-domain-logins winbind
winbind-disable-logins = /usr/libexec/amethystora-domain-logins image
