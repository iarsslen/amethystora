# Copied here by ame security mac away (/usr/libexec/amethystora-mac). What 60-amethystora-mac.conf does, on
# every network but the ones named home (ame security home-networks): each Wi-Fi and wired network sees a
# hardware address of its own for this machine, the same each time it connects to that network ("stable",
# made from the connection and a secret of this machine's), none is told its name, none has its DHCPv6
# identity, and systemd-resolved sends none of its single-label lookups over LLMNR. The networks named home
# are given their own values instead (amethystora-mac home): NetworkManager cannot limit a default to
# connections, only to devices, so each home connection says what it wants itself.
#
# The machine's name is also announced by Avahi on every network, which only ame security
# network-daemons turns off: Avahi knows interfaces, not networks.
[connection-amethystora-mac]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
ipv4.dhcp-send-hostname=0
ipv6.dhcp-send-hostname=0
ipv4.dhcp-client-id=mac
ipv6.dhcp-duid=stable-uuid
connection.llmnr=0
