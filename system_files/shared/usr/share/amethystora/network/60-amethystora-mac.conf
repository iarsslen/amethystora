# Copied here by ame security mac (/usr/libexec/amethystora-mac). Each Wi-Fi and wired network sees a
# hardware address of its own for this machine, the same each time it connects to that network
# ("stable", made from the connection and a secret of this machine's), and none is told its name. What
# DHCP identifies the machine by follows suit: over IPv4 the address that network sees, over IPv6 an
# identity (DUID) of that network's own, where it would otherwise be one made from the machine-id and
# the same on every network. Temporary IPv6 addresses are a switch of their own (ame security
# ipv6-privacy), on as the image ships.
#
# A network that lets in only registered devices needs the machine's own address: in Settings, open
# that network, then Identity, and set Cloned Address to Permanent.
[connection-amethystora-mac]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
ipv4.dhcp-send-hostname=0
ipv6.dhcp-send-hostname=0
ipv4.dhcp-client-id=mac
ipv6.dhcp-duid=stable-uuid
