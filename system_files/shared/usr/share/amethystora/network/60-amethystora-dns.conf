# Copied here by ame security dns (/usr/libexec/amethystora-dns) beside the resolver it writes into
# /etc/systemd/resolved.conf.d. Every name on no network's own domains goes to that resolver, encrypted.
# What still goes to a network's own DNS servers, its own names, a VPN's and the connectivity check, goes
# in plain text, as those servers cannot be asked otherwise: without this, every network would seem to
# have no internet. A connection that sets its own "DNS over TLS" in its settings keeps it.
[connection-amethystora-dns]
connection.dns-over-tls=0
