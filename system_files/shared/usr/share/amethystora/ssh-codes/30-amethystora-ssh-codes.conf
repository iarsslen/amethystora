# One-time codes for SSH, copied here by `ame security ssh-codes on` (/usr/libexec/amethystora-ssh-codes).
# sshd keeps the first value it reads, so this file comes before 40-amethystora-hardening.conf and Fedora's
# own. A key logs in as before. A password only gets in through PAM, which asks for the code after it.
KbdInteractiveAuthentication yes
PasswordAuthentication no
AuthenticationMethods publickey keyboard-interactive
