# Written by `ame security kernel strict` (/usr/libexec/amethystora-hardening) beside the image's own
# 60-amethystora-hardening.conf, whose values these raise, and taken away by `ame security kernel standard`.

# No io_uring: most kernel exploits of recent years went through it, and the audit log cannot see the I/O
# it does. Programs that use it fall back or fail (QEMU's io_uring backend, Samba's vfs_io_uring, some Node).
kernel.io_uring_disabled = 2

# Only root may attach a debugger to a running process (gdb -p, strace -p)
kernel.yama.ptrace_scope = 2

# As much address randomisation as the kernel allows. ThreadSanitizer and MemorySanitizer cannot run.
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16
