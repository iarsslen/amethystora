# Written by `ame security kernel strict` (/usr/libexec/amethystora-hardening), and taken away by
# `ame security kernel standard`. IPsec's packet handling, through which page-cache attacks have gone.
# libreswan and strongSwan cannot connect; WireGuard is not affected. xfrm_user is built into Fedora's
# kernel and cannot be blocked.
install esp4 /usr/bin/false
install esp6 /usr/bin/false
