# Written by `ame security firewall off` (/usr/libexec/amethystora-hardening), and taken away again by
# `ame security firewall on`. With the Amethystora zone off, the default zone is Fedora Workstation's, and
# a ban has to be in the zone the interfaces use, or it matches nothing.
[DEFAULT]
banaction = firewallcmd-rich-rules[actiontype=<multiport>, zone=FedoraWorkstation]
banaction_allports = firewallcmd-rich-rules[actiontype=<allports>, zone=FedoraWorkstation]
