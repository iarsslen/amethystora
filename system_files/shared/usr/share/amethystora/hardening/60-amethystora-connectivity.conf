# Written by `ame security connectivity-check off` (/usr/libexec/amethystora-hardening), and taken away by
# `ame security connectivity-check on`: NetworkManager no longer fetches Fedora's hotspot.txt to learn whether a
# network reaches the internet. It is read after Fedora's 20-connectivity-fedora.conf and overrides it.
[connectivity]
enabled=false
