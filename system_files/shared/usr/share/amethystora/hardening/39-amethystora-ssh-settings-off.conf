# Written by `ame security ssh-settings off` (/usr/libexec/amethystora-hardening), and taken away again by
# `ame security ssh-settings on`. The image's SSH server settings (40-amethystora-hardening.conf) are off:
# these are OpenSSH's and Fedora's own, and sshd keeps the first value it reads, so this file sorts first.
PermitRootLogin prohibit-password
MaxAuthTries 6
LoginGraceTime 120
X11Forwarding yes
