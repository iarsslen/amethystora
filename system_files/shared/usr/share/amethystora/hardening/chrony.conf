# Written by `ame security time on` (/usr/libexec/amethystora-hardening) in place of the image's
# chrony.conf, which `ame security time off` puts back. The clock decides whether certificates and
# signatures are valid, so it is taken only from servers that prove who they are with NTS, never from
# one a network hands out, and three of them must agree before it moves.
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
server ptbtime2.ptb.de iburst nts
server ntppool1.time.nl iburst nts
server ntppool2.time.nl iburst nts

# Only sources that proved who they are count, and three have to agree
authselectmode require
minsources 3

# A clock too far off to check the servers' certificates can still be set, once
nocerttimecheck 1

# No control over the network; chronyc still works through its local socket
cmdport 0

driftfile /var/lib/chrony/drift
makestep 1.0 3
rtcsync
ntsdumpdir /var/lib/chrony
leapseclist /usr/share/zoneinfo/leap-seconds.list
logdir /var/log/chrony
