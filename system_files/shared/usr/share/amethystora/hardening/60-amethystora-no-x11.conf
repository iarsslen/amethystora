# Written by `ame security block-xwayland on` (/usr/libexec/amethystora-hardening), and taken away by
# `ame security block-xwayland off`: GNOME Shell starts without Xwayland. The command is the unit's own
# with --no-x11 added; 20-tests.sh fails the build when GNOME Shell's unit starts it any other way.
[Service]
ExecStart=
ExecStart=/usr/bin/gnome-shell --mode=%i --no-x11
