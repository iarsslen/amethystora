# Network protection with NETWORK=block: the Emerging Threats Open families whose rules drop instead of
# only alerting. Each is about something with no legitimate use on a desktop, recognised with little
# room for doubt, and modify.conf still leaves the rules ET rates as low confidence alerting only.
# Everything else keeps alerting. suricata-update matchers, one a line (see disable.conf).

# Addresses: command servers, hijacked netblocks (Spamhaus DROP), hosts known to be compromised or
# attacking, and Cobalt Strike servers
group:botcc.rules
group:botcc.portgrouped.rules
group:ciarmy.rules
group:compromised.rules
group:drop.rules
group:dshield.rules
group:threatview_CS_c2.rules

# Traffic: malware talking home, exploits and exploit kits, phishing pages, worms and cryptominers
group:emerging-coinminer.rules
group:emerging-exploit.rules
group:emerging-exploit_kit.rules
group:emerging-malware.rules
group:emerging-mobile_malware.rules
group:emerging-phishing.rules
group:emerging-worm.rules
