# Network protection: the rules left out entirely, as suricata-update matchers, one a line:
#   group:<file>   every rule from that rule file, by its name; * matches as in a file name
#   <number>       one rule
# `ujust blocked-connections allow <rule>` adds rules of this machine's own after these
# (/etc/amethystora/ips-allowed). Leaving a family out saves the memory it would take too.

# Suricata's own protocol anomaly rules: packets that bend a protocol's rules, which ordinary desktop
# traffic does all day
group:*-events.rules
group:files.rules

# What a desktop does on purpose: games, chat, peer-to-peer and file sharing, dynamic DNS, Tor,
# well-known services that are also abused, and rules that only describe traffic or an app's user agent
group:emerging-chat.rules
group:emerging-dyn_dns.rules
group:emerging-file_sharing.rules
group:emerging-games.rules
group:emerging-hunting.rules
group:emerging-inappropriate.rules
group:emerging-info.rules
group:emerging-ja3.rules
group:emerging-p2p.rules
group:emerging-ta_abused_services.rules
group:emerging-user_agents.rules
group:tor.rules

# What cannot run here: ActiveX, and the industrial control protocols
group:emerging-activex.rules
group:emerging-scada.rules
