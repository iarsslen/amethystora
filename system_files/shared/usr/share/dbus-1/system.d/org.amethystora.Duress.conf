<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The duress service (amethystora-duress.service): pam_fprintd (Run, the finger) and amethystora-duress-pam
     (RunPassword, the password), which run as root in GDM, sudo and polkit's helper, are the only ones that
     tell it anything. Nobody else may own the name or call it. -->
<busconfig>
  <policy user="root">
    <allow own="org.amethystora.Duress"/>
    <allow send_destination="org.amethystora.Duress"
           send_interface="org.amethystora.Duress" send_member="Run"/>
    <allow send_destination="org.amethystora.Duress"
           send_interface="org.amethystora.Duress" send_member="RunPassword"/>
  </policy>
</busconfig>
