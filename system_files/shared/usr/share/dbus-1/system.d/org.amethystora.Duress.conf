<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The duress finger's service (amethystora-duress.service): pam_fprintd, which runs as root in GDM, sudo
     and polkit's helper, is the only one that tells it anything. Nobody else may own the name or call it. -->
<busconfig>
  <policy user="root">
    <allow own="org.amethystora.Duress"/>
    <allow send_destination="org.amethystora.Duress"
           send_interface="org.amethystora.Duress" send_member="Run"/>
  </policy>
</busconfig>
