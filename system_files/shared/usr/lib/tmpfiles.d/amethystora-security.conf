# The image ships an empty /var: the security watcher's state, which the report reads (status.json), and
# the quarantine /usr/libexec/amethystora-quarantine moves found files into, which is root's alone.
d /var/lib/amethystora 0755 root root -
d /var/lib/amethystora/security 0755 root root -
d /var/lib/amethystora/quarantine 0700 root root -
# Network protection (amethystora-ips.service): the rules it builds, and Suricata's own directories,
# which the suricata package makes at install and so never reach a machine that updates into it
d /var/lib/amethystora/ips 0700 root root -
d /var/lib/suricata 2770 suricata suricata -
d /var/log/suricata 0750 suricata suricata -
