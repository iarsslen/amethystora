# fail2ban keeps its ban database in /var/lib/fail2ban (dbfile in /etc/fail2ban/fail2ban.conf). The
# package ships that directory only in its payload, and its own tmpfiles entry creates /run/fail2ban
# and nothing else. A bootc image's /var reaches a machine once, when it is installed, so on a machine
# installed before fail2ban was part of the image the directory never exists: fail2ban cannot open its
# database and exits with status 255 straight after "Server ready".
#
# Not named fail2ban.conf, which is the package's own file in this directory and would be replaced.
d /var/lib/fail2ban 0755 root root -
