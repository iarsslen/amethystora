# Firmware the kernel reads before the image's own, once `ame apps xbox-adapter on` has pointed it here
# (firmware_class.path): root's alone, and the security watcher takes no file in it but Microsoft's firmware for
# the Xbox wireless adapter, as pinned in /usr/share/amethystora/xone/firmware
d /var/lib/amethystora/firmware 0755 root root -
