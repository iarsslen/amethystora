# Login screen defaults: the Amethystora wallpaper and the Inter font. Without them the DMS greeter shows its
# own placeholder backdrop. Copied only when missing, so `dms-greeter sync` (the user's own look) wins.
C /var/cache/dms-greeter/session.json - - - - /usr/share/amethystora/greeter/session.json
C /var/cache/dms-greeter/settings.json - - - - /usr/share/amethystora/greeter/settings.json
