# Flatpak reads the overrides of its system installation from /var/lib/flatpak/overrides and from nowhere
# else, so the image's global one, /etc/flatpak/overrides/global, only applies through this link. It is
# not replaced when something is already there: a global override written with `flatpak override
# --system` replaces the link with a file of its own, which keeps the image's rules it read through it,
# and is the machine's from then on.
L /var/lib/flatpak/overrides/global - - - - /etc/flatpak/overrides/global

# The global override takes the Flatpak service from every app. These apps the image installs ask for it in
# their manifests and do not work without it, so it is given back to them by name, as it would be in
# Flatseal: Mission Center runs its gatherer outside the sandbox to see the machine's processes, Warehouse
# runs flatpak, DistroShelf and Podman Desktop distrobox and podman, Builder the host's tools, and Refine the
# host's settings (Bazaar, which installs through it, has its link in bazaar-flatpak.conf). The report and the
# watcher take them as allowed (/usr/share/amethystora/allow.d/app-permissions).
L /var/lib/flatpak/overrides/io.missioncenter.MissionCenter - - - - /usr/share/amethystora/flatpak-overrides/io.missioncenter.MissionCenter
L /var/lib/flatpak/overrides/io.github.flattool.Warehouse - - - - /usr/share/amethystora/flatpak-overrides/io.github.flattool.Warehouse
L /var/lib/flatpak/overrides/page.tesk.Refine - - - - /usr/share/amethystora/flatpak-overrides/page.tesk.Refine
L /var/lib/flatpak/overrides/com.ranfdev.DistroShelf - - - - /usr/share/amethystora/flatpak-overrides/com.ranfdev.DistroShelf
L /var/lib/flatpak/overrides/io.podman_desktop.PodmanDesktop - - - - /usr/share/amethystora/flatpak-overrides/io.podman_desktop.PodmanDesktop
L /var/lib/flatpak/overrides/org.gnome.Builder - - - - /usr/share/amethystora/flatpak-overrides/org.gnome.Builder
