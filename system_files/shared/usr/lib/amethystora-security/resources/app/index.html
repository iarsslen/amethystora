<!doctype html>
<html lang="en">
<head>

    <link rel="stylesheet" href="security.css">

</head>

         artwork, so this drawing is under the GNU General Public License, version 3, as that file is
         (NOTICE) -->
    <template id="shield-art">
        <svg class="art" viewBox="0 0 48 48" aria-hidden="true">

                    <stop offset="1" stop-color="#0096e6"/>
                </linearGradient>
            </defs>

    <aside class="sidebar">
        <!-- The wordmark of the boot splash and the login screen, the glowing stone as its "a" -->
        <div class="brand" role="img" aria-label="Amethystora Security" data-i18n-attr="aria-label">
            <span class="wordmark" dir="ltr"><img class="a" src="gem.svg" alt="">methystora</span>
            <span class="product" data-i18n>Security</span>
        </div>
        <nav class="nav" aria-label="Sections" data-i18n-attr="aria-label">
            <button type="button" data-page="overview">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-shield"/></svg>
                <span class="grow" data-i18n>Overview</span>
                <span class="badge" hidden></span>
            </button>
            <button type="button" data-page="scan">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-scan"/></svg>
                <span class="grow" data-i18n>Virus scan</span>
                <span class="badge" hidden></span>
            </button>
            <button type="button" data-page="network">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-globe"/></svg>
                <span class="grow" data-i18n>Network</span>
                <span class="badge" hidden></span>
            </button>
            <button type="button" data-page="apps">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-apps"/></svg>
                <span class="grow" data-i18n>Apps</span>
                <span class="badge" hidden></span>
            </button>
            <button type="button" data-page="containers">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-box"/></svg>
                <span class="grow" data-i18n>Containers</span>
                <span class="badge" hidden></span>
            </button>
        </nav>
        <div class="sidebar-foot">
            <button type="button" class="link quiet" id="open-manual">
                <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-book"/></svg>
                <span data-i18n>Security in the manual</span>
            </button>
            <p class="terminal"><span data-i18n>Also in a terminal:</span><br><code dir="ltr">ame security status</code></p>
        </div>
    </aside>
    <main id="main">
        <div id="view"></div>
    </main>
    <div class="drop" aria-hidden="true" data-i18n>Drop to scan</div>
</body>
</html>
