# Amethystora kernel and network hardening. Loaded after systemd's 50-default.conf, so these values win.
# Left alone on purpose: unprivileged user namespaces (Flatpak, Distrobox, browsers' sandboxes need them),
# rp_filter (Fedora's loose mode 2, which Tailscale and VPNs need) and IP forwarding (containers, -dx).

# Hide kernel addresses and the kernel log from unprivileged users
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Processes may only debug (ptrace) their own children, unless root: stops one compromised app reading
# another's memory. `gdb -p` on a running process then needs sudo.
kernel.yama.ptrace_scope = 1

# No BPF programs for unprivileged users, and a hardened BPF JIT for everyone else
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# No replacing the running kernel with kexec (not used by updates, which reboot)
kernel.kexec_load_disabled = 1

# Unprivileged users may not load TTY line disciplines or use userfaultfd, both used by kernel exploits
dev.tty.ldisc_autoload = 0
vm.unprivileged_userfaultfd = 0

# No writing to FIFOs and files that belong to someone else in world-writable sticky directories (/tmp)
fs.protected_fifos = 2
fs.protected_regular = 2
# setuid programs never leave core dumps that could hold secrets
fs.suid_dumpable = 0

# Ignore ICMP redirects and source-routed packets: a machine on the same network could reroute traffic
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# SYN flood protection, and no TIME-WAIT assassination
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
