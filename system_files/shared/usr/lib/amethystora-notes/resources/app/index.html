    <aside class="sidebar">
        <!-- The wordmark of the boot splash and the login screen, the glowing stone as its "a" -->
        <div class="brand" role="img" aria-label="Amethystora Notes">
            <span class="wordmark"><img class="a" src="gem.svg" alt="">methystora</span>
            <span class="product">Notes</span>
        </div>
        <div class="modes" role="tablist" aria-label="Notes or tasks">
            <button type="button" role="tab" data-mode="notes">
                <svg class="icon" width="17" height="17" aria-hidden="true"><use href="#i-notes"/></svg>
                <span>Notes</span>
            </button>
            <button type="button" role="tab" data-mode="tasks">
                <svg class="icon" width="17" height="17" aria-hidden="true"><use href="#i-done"/></svg>
                <span>Tasks</span>
                <span class="count" id="today-count" hidden></span>
            </button>
        </div>
        <label class="search">
            <svg class="icon" width="17" height="17" aria-hidden="true"><use href="#i-search"/></svg>
            <input type="search" id="search" placeholder="Search" autocomplete="off" spellcheck="false">
        </label>
        <nav class="nav" id="nav" aria-label="Sections"></nav>
        <div class="sidebar-foot">
            <button type="button" class="foot-button" id="open-settings">
                <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-settings"/></svg>
                <span>Settings</span>
            </button>
            <button type="button" class="foot-button" id="lock" hidden>
                <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-lock"/></svg>
                <span>Lock</span>
            </button>
            <button type="button" class="link quiet" id="open-manual">
                <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-book"/></svg>
                <span>Notes in the manual</span>
            </button>
        </div>
    </aside>
    <main id="main"></main>
    <div class="toasts" id="toasts" aria-live="polite"></div>

</html>
