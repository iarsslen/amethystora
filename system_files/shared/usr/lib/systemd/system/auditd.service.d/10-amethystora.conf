[Service]
# The audit log is a switch too (AUDIT_LOG in /etc/amethystora/security.conf), read as auditd starts at boot:
# off, it is skipped rather than failed, and so are its rules (audit-rules.service and
# amethystora-audit-rules.service). The kernel still sends what it would have logged to the journal.
ExecCondition=/usr/libexec/amethystora-security-config --is AUDIT_LOG on
