# libbpf reads the kernel's build configuration from /boot/config-RELEASE. An ostree machine keeps it in
# /usr/lib/modules, which ProtectKernelModules hides from the loader, so every scheduler failed to load with
# -EINVAL. 04-packages.sh puts a copy of each kernel's in this folder, which the loader alone sees as /boot.
[Service]
BindReadOnlyPaths=/usr/lib/amethystora/kconfig:/boot
