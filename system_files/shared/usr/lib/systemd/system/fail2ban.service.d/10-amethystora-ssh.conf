[Unit]
# fail2ban's one jail is SSH's (/etc/fail2ban/jail.d/10-amethystora.conf), and the SSH server is off by
# default: without it, fail2ban would follow the journal for nothing. It is skipped then, and starts with
# the server (sshd.service.d/10-amethystora-fail2ban.conf) unless `ame security failed-logins off` said not to.
After=sshd.service
PartOf=sshd.service

[Service]
ExecCondition=/usr/libexec/amethystora-hardening is-on failed-logins
ExecCondition=/usr/bin/systemctl is-active --quiet sshd.service
