# mcelog reads machine checks on Intel processors only: on AMD's it says it does not support them and exits
# with an error, and the kernel's edac_mce_amd reports them instead. Fedora's unit skips mcelog only while that
# module is loaded, which it never is in a virtual machine, so a VM on an AMD processor had a failed unit at
# every boot.
[Service]
ExecCondition=/usr/bin/sh -c '! grep -q "^vendor_id[[:space:]]*: AuthenticAMD" /proc/cpuinfo'
