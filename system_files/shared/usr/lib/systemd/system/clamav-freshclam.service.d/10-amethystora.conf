[Service]
# Nothing is downloaded while VIRUS_SCAN=off in /etc/amethystora/security.conf: skipped, not failed
ExecCondition=/usr/libexec/amethystora-security-config --is VIRUS_SCAN manual weekly
# freshclam names the machine by an ID of its own in every check for new signatures, a dozen a day, kept
# in freshclam.dat for good: a new one each boot, so that it never follows the machine from one network to
# the next. A wait the mirrors asked for, kept in the same file, does not outlive the boot either.
ExecStartPre=-/usr/bin/rm -f /var/lib/clamav/freshclam.dat
