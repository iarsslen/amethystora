# DisplayLinkManager needs evdi, which the package's unit loads in ExecStartPre= and restarts after every five
# seconds without end. With Secure Boot on, the kernel refuses evdi until Amethystora's key is enrolled
# (ame security secure-boot), so such a machine had the unit failing every five seconds from boot. Loading it
# is a condition here: without evdi the unit is skipped, not failed, and tried again at the next boot or when
# a dock is plugged in.
[Service]
ExecStartPre=
ExecCondition=/usr/sbin/modprobe evdi
