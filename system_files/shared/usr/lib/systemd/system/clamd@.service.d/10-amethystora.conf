[Unit]
# The image ships no virus signatures: clamd cannot start until clamav-freshclam.service has downloaded
# them after the first boot. Keep retrying instead of giving up after a few quick failures.
Wants=clamav-freshclam.service
After=clamav-freshclam.service
StartLimitIntervalSec=0
# Started by its socket (clamd@.socket) when something scans
Requires=clamd@%i.socket
After=clamd@%i.socket

[Service]
# Nothing holds the signatures in memory while VIRUS_SCAN=off in /etc/amethystora/security.conf
ExecCondition=/usr/libexec/amethystora-security-config --is VIRUS_SCAN manual weekly
RestartSec=60
# In the foreground: a clamd that forks would no longer be the process systemd handed the socket to, and
# would make one of its own instead
Type=simple
ExecStart=
ExecStart=/usr/sbin/clamd -c /etc/clamd.d/%i.conf --foreground=yes
