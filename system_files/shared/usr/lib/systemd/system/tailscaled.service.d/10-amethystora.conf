# tailscaled runs on every machine, and by default streams its logs, every connection it makes among them,
# to Tailscale's servers, whether the machine ever joins a tailnet or not. Not here. Tailscale's support may
# ask for them: TS_NO_LOGS_NO_SUPPORT=false in /etc/default/tailscaled, which systemd reads after this,
# sends them again.
[Service]
Environment=TS_NO_LOGS_NO_SUPPORT=true
