# Swap in compressed memory as Fedora sets it up (zram-generator-defaults), with zstd as the second
# algorithm: pages are compressed with lzo-rle as they leave RAM, which is quick, and those that then stay
# unused are repacked with zstd by amethystora-zram-recompress.timer. Measured on a 4 GB machine, that took
# about a fifth less RAM than lzo-rle alone and brought pages back sooner than zstd alone, whose cost is in
# compressing. `ame system zram fast|compact` chooses one algorithm instead, in /etc.
[zram0]
compression-algorithm = lzo-rle zstd
