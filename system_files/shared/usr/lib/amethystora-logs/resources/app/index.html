<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; font-src 'self' file:">
    <title>Amethystora Logs</title>
    <link rel="stylesheet" href="logs.css">
    <script src="logs.js" defer></script>
</head>
<body>
    <svg class="sprite" aria-hidden="true">
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16v.01"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></symbol>
        <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.5l8.5 4.5-8.5 4.5L3.5 8zM3.5 12.5l8.5 4.5 8.5-4.5M3.5 16.5l8.5 4.5 8.5-4.5"/></symbol>
        <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/></symbol>
        <symbol id="i-crash" viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></symbol>
        <symbol id="i-apps" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
        <symbol id="i-live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
        <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12.5 15H17"/></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
        <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
        <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
        <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/></symbol>
        <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></symbol>
        <symbol id="i-spinner" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1-9 9"/></symbol>
    </svg>

    <aside class="sidebar">
        <!-- The wordmark of the boot splash and the login screen, the glowing stone as its "a" -->
        <div class="brand" role="img" aria-label="Amethystora Logs">
            <span class="wordmark"><img class="a" src="gem.svg" alt="">methystora</span>
            <span class="product">Logs</span>
        </div>
        <nav class="nav" aria-label="Logs">
            <button type="button" data-category="important">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-alert"/></svg>
                <span class="grow">Important</span>
                <span class="badge" hidden></span>
            </button>
            <button type="button" data-category="all">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-list"/></svg>
                <span class="grow">All</span>
            </button>
            <button type="button" data-category="session">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-user"/></svg>
                <span class="grow">Your session</span>
            </button>
            <button type="button" data-category="system">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-layers"/></svg>
                <span class="grow">System</span>
            </button>
            <button type="button" data-category="kernel">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-chip"/></svg>
                <span class="grow">Kernel and hardware</span>
            </button>
            <button type="button" data-category="security">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-shield"/></svg>
                <span class="grow">Security</span>
            </button>
            <button type="button" data-category="crashes">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-crash"/></svg>
                <span class="grow">Crashes</span>
                <span class="badge" hidden></span>
            </button>
        </nav>
        <nav class="nav" aria-label="Browse">
            <p class="nav-label">Browse</p>
            <button type="button" data-page="sources">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-apps"/></svg>
                <span class="grow">Apps and services</span>
            </button>
        </nav>
        <div class="sidebar-foot">
            <button type="button" class="link quiet" id="open-manual">
                <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-book"/></svg>
                <span>Logs in the manual</span>
            </button>
            <p class="terminal" id="usage" hidden></p>
            <p class="terminal">Also in a terminal:<br><code id="terminal-hint">journalctl</code></p>
        </div>
    </aside>
    <main id="main">
        <div id="view"></div>
    </main>
</body>
</html>
