<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; font-src 'self' file:">
    <title data-i18n>Amethystora Backups</title>
    <link rel="stylesheet" href="backups.css">
    <script src="i18n.js" defer></script>
    <script src="backups.js" defer></script>
</head>
<body>
    <svg class="sprite" aria-hidden="true">
        <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6M3.5 4v4.5H8M12 7.5V12l3 2"/></symbol>
        <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="4.5" rx="1"/><path d="M5 8.5v10a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5v-10M10 12.5h4"/></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/></symbol>
        <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10M19.5 4.5L11 13M17.5 14v4a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h4"/></symbol>
        <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19"/></symbol>
        <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3.5H7.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3.5V8h4.5"/></symbol>
        <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-5v6h-4A1.5 1.5 0 0 1 4 19z"/></symbol>
        <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 13.5h17M7 16.25h.01M10 16.25h.01"/></symbol>
        <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.5 1.6A3.75 3.75 0 0 1 17.25 18.5z"/></symbol>
        <symbol id="i-restore" viewBox="0 0 24 24"><path d="M9 14L4.5 9.5 9 5M4.5 9.5h10a5 5 0 0 1 0 10H11"/></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.5l8.5 4.5-8.5 4.5L3.5 8zM3.5 12.5l8.5 4.5 8.5-4.5M3.5 16.5l8.5 4.5 8.5-4.5"/></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 15v3.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16v.01"/></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></symbol>
        <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12.5 15H17"/></symbol>
        <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M10 3.5l1.6 4.9 4.9 1.6-4.9 1.6L10 16.5l-1.6-4.9L3.5 10l4.9-1.6zM18 14l.8 2.2 2.2.8-2.2.8L18 20l-.8-2.2L15 17l2.2-.8z"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
        <symbol id="i-spinner" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1-9 9"/></symbol>
    </svg>

    <aside class="sidebar">
        <!-- The wordmark of the boot splash and the login screen, the glowing stone as its "a" -->
        <div class="brand" role="img" aria-label="Amethystora Backups" data-i18n-attr="aria-label">
            <span class="wordmark" dir="ltr"><img class="a" src="gem.svg" alt="">methystora</span>
            <span class="product" data-i18n>Backups</span>
        </div>
        <nav class="nav" aria-label="Backups" data-i18n-attr="aria-label">
            <button type="button" data-page="browse">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-history"/></svg>
                <span class="grow" data-i18n>Browse</span>
            </button>
            <button type="button" data-page="status">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-archive"/></svg>
                <span class="grow" data-i18n>Status</span>
                <span class="nav-dot" id="status-dot" hidden></span>
            </button>
        </nav>
        <nav class="nav elsewhere" aria-label="Elsewhere" data-i18n-attr="aria-label">
            <p class="nav-label" data-i18n>Elsewhere</p>
            <button type="button" id="open-security">
                <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-shield"/></svg>
                <span class="grow" data-i18n>Security settings</span>
                <svg class="icon faint" width="16" height="16" aria-hidden="true"><use href="#i-external"/></svg>
            </button>
        </nav>
        <div class="sidebar-foot">
            <button type="button" class="link quiet" id="open-manual">
                <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-book"/></svg>
                <span data-i18n>Backups in the manual</span>
            </button>
            <p class="terminal"><span data-i18n>Also in a terminal:</span><br><code dir="ltr">ame backup</code></p>
        </div>
    </aside>
    <main id="main">
        <header class="topbar" id="topbar"></header>
        <div id="view"></div>
    </main>
    <div id="dialog"></div>
</body>
</html>
