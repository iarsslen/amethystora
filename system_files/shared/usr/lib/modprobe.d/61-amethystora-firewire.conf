# FireWire gives devices direct memory access: a device plugged in can read and write the machine's memory.
# Blocked like the modules in 60-amethystora-hardening.conf, but a switch of its own (ame security firewire), for
# FireWire sound cards and DV cameras: off, /etc/modprobe.d holds a link of this name to /dev/null.
install firewire_core /usr/bin/false
install firewire_ohci /usr/bin/false
install firewire_sbp2 /usr/bin/false
