# Kernel modules a desktop never needs, with a history of exploitable bugs. `install ... /usr/bin/false`
# stops them loading at all, also on demand (a program opening a socket of that type) or by hand.

# Rare network protocols
install dccp /usr/bin/false
install sctp /usr/bin/false
install rds /usr/bin/false
install tipc /usr/bin/false
install n_hdlc /usr/bin/false
install ax25 /usr/bin/false
install netrom /usr/bin/false
install x25 /usr/bin/false
install rose /usr/bin/false
install decnet /usr/bin/false
install econet /usr/bin/false
install af_802154 /usr/bin/false
install ipx /usr/bin/false
install appletalk /usr/bin/false
install psnap /usr/bin/false
install p8022 /usr/bin/false
install p8023 /usr/bin/false
install atm /usr/bin/false

# Old or embedded filesystems (USB sticks, SD cards and Mac drives use others, which stay available)
install cramfs /usr/bin/false
install freevxfs /usr/bin/false
install jffs2 /usr/bin/false
install hfs /usr/bin/false

# FireWire gives devices direct memory access
install firewire_core /usr/bin/false
install firewire_ohci /usr/bin/false
install firewire_sbp2 /usr/bin/false

# Virtual video test driver, only for kernel development
install vivid /usr/bin/false

# AFS and its RxRPC transport, through which Dirty Frag went
install rxrpc /usr/bin/false
install kafs /usr/bin/false

# Test and fault-injection drivers, only for kernel development
install mce-inject /usr/bin/false
install hwpoison-inject /usr/bin/false
install aer_inject /usr/bin/false
install scsi_debug /usr/bin/false
install nandsim /usr/bin/false
install mtdram /usr/bin/false
install dummy_hcd /usr/bin/false
install vimc /usr/bin/false
install vim2m /usr/bin/false
install visl /usr/bin/false

# Kernel messages sent over the network
install netconsole /usr/bin/false

# CAN buses, which cars and machines use. Their core is built into the kernel; these are what reach it
install can-raw /usr/bin/false
install can-bcm /usr/bin/false
install can-gw /usr/bin/false
install can-isotp /usr/bin/false
install can-j1939 /usr/bin/false
install vcan /usr/bin/false
install vxcan /usr/bin/false
install slcan /usr/bin/false

# GNSS receivers, through the kernel's own GNSS layer
install gnss /usr/bin/false
install gnss-serial /usr/bin/false
install gnss-usb /usr/bin/false
install gnss-ubx /usr/bin/false
install gnss-mtk /usr/bin/false
install gnss-sirf /usr/bin/false

# Mesh networking and MCTP, for machines in a data centre
install batman-adv /usr/bin/false
install mctp-serial /usr/bin/false
install mctp-i3c /usr/bin/false
install mctp-usb /usr/bin/false

# The floppy drive, the parallel port and game ports
install floppy /usr/bin/false
install parport /usr/bin/false
install parport_pc /usr/bin/false
install ppdev /usr/bin/false
install lp /usr/bin/false
install gameport /usr/bin/false

# Cluster, network and old filesystems no desktop mounts
install gfs2 /usr/bin/false
install ocfs2 /usr/bin/false
install ocfs2_dlmfs /usr/bin/false
install orangefs /usr/bin/false
install coda /usr/bin/false
install affs /usr/bin/false
install befs /usr/bin/false
install ufs /usr/bin/false
install minix /usr/bin/false
install romfs /usr/bin/false
install ubifs /usr/bin/false
install zonefs /usr/bin/false
