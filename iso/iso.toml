# The installer ISO, built by .github/workflows/build-iso.yml with bootc-image-builder.
#
# The image is carried on the ISO, so installing needs no network. Anaconda asks only for the disk,
# where it offers encryption; GNOME Initial Setup creates the user on first boot, as on Silverblue.
# The workflow replaces @IMAGE@ with the repository of the image the ISO carries (ghcr.io/iarsslen/amethystora,
# or an image of one's own, whose template runs the same steps).

[customizations.iso]
volume_id = "Amethystora"
application_id = "Amethystora"
publisher = "Amethystora"

# Track the image in the registry rather than the copy on the ISO, signature-checked from the first
# update: the installed system's policy.json takes Amethystora's images only with its signature. An
# in-place switch only rewrites the origin, so it fetches nothing and needs no network. build-iso.yml
# fails on a switch without the flag; amethystora-signed-updates stays for a later plain `bootc switch`.
# The marker tells the first boot that this is a new installation, which gets the hourly snapshots of the
# home folders (system-setup.hooks.d/26-snapshots-new-installation.sh). A switch that fails fails the
# installation, as in iso/live/installer.ks, rather than leave a machine on the ISO's copy, never updated:
# Anaconda goes by the script's last exit status only, hence set -e.
# The NVIDIA images' driver is signed with a key the firmware does not know: with Secure Boot on, the
# kernel refuses it until the key is enrolled, and their kernel arguments turn off the simple display
# driver that would stand in. So their certificates are queued as `ame security secure-boot` queues them,
# and the MOK manager asks for the password amethystora at the first start. No backslashes in here:
# TOML would read them first.
[customizations.installer.kickstart]
contents = """
%post --erroronfail
set -e
bootc switch --mutate-in-place --enforce-container-sigpolicy --transport registry @IMAGE@:stable
mkdir -p /var/lib/amethystora && touch /var/lib/amethystora/new-installation
if [ -e /usr/lib/bootc/kargs.d/00-nvidia.toml ] && mokutil --sb-state 2>/dev/null | grep -qi enabled; then
    mokutil --timeout -1 || :
    { echo amethystora; echo amethystora; } | mokutil --import /usr/share/amethystora/secure-boot/*.der || :
fi
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime"
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Subscription",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]
