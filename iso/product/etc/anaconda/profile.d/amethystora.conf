# Anaconda picks its profile by the ID in the installer's own os-release. The installer is built with
# generic-release in place of fedora-release (.github/workflows/build-iso.yml), so that ID is
# "generic", which no profile answers to: Anaconda would fall back to its bare defaults and partition
# with LVM where Fedora's profile chooses Btrfs. This profile answers to it and takes everything from
# Fedora's.

[Profile]
profile_id = amethystora
base_profile = fedora

[Profile Detection]
os_id = generic
