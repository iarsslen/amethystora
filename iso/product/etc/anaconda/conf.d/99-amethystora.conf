# Amethystora's look for the installer, from branding/generate.mjs. Anaconda reads conf.d after the
# profile it detects from the installer's own os-release, which is Fedora's, so this stylesheet
# replaces the one the Fedora profile names.

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/amethystora/amethystora.css
