# libreport-anaconda's rules for installer crashes, without the one that files them in Fedora's
# Bugzilla: nothing in the crash dialog leads to it any more (workflows.d/anaconda_event.conf),
# and this makes sure nothing else can. The two rules left open the report window itself.

EVENT=report-gui component=anaconda
    report-gtk -- "$DUMP_DIR"

EVENT=report-cli component=anaconda
    report-cli -- "$DUMP_DIR"
