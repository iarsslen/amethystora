# Anaconda picks its profile by the ID in os-release. In the live session that is the image's own,
# amethystora, so this answers to it, takes everything from Fedora's profile as the installer ISO's does
# (iso/product/etc/anaconda/profile.d), and leaves the account to GNOME Initial Setup on the first boot.

[Profile]
profile_id = amethystora-live
base_profile = fedora

[Profile Detection]
os_id = amethystora

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/amethystora/amethystora.css
hidden_spokes = NetworkSpoke PasswordSpoke UserSpoke
hidden_webui_pages = anaconda-screen-accounts
