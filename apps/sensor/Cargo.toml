# amethystora-sensor: the daemon behind the BPF audit sensor. It is in the apps workspace, but shares
# nothing with the GTK apps: no amethystora-ui, no GTK. The apps stage builds it on its own
# (cargo build -p amethystora-sensor) with clang, bpftool and libbpf-devel added, and 13-apps.sh installs
# it as /usr/libexec/amethystora-sensor. plans/security/PLAN-audit-cost.md says why it exists.
[package]
name = "amethystora-sensor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# libbpf-rs on Fedora's own libbpf (no vendored copy): default-features off drops vendored-libbpf, and
# libbpf-sys with no features links the image's libbpf shared library. 0.27 needs libbpf-sys 1.7, which
# links libbpf 1.6 and later all the same (build-apps.sh checks the versions agree).
libbpf-rs = { version = "=0.27.2", default-features = false, features = ["libbpf-sys"] }
libbpf-sys = { version = "=1.7.0", default-features = false }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
