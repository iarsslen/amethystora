<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* Four fingers for Today: four fingers slide to the left, and the Today panel slides in from the right */
.art { --loop: 2.6s; }
@keyframes slide { 0%, 8% { transform: translateX(26px); opacity: 0; } 14% { opacity: 1; } 46% { transform: translateX(-30px); opacity: 1; } 52%, 100% { transform: translateX(-30px); opacity: 0; } }
@keyframes panel { 0%, 24% { transform: translateX(70px); } 52%, 86% { transform: translateX(0); } 100% { transform: translateX(70px); } }
.fingers { position: absolute; left: 32px; top: 38px; width: 60px; height: 40px; animation-name: slide; }
.dot { opacity: 0.95; }
.today { left: 86px; top: 6px; width: 58px; height: 100px; border-radius: 10px; animation-name: panel; }
.today .line { left: 8px; }
.tile { position: absolute; left: 8px; width: 42px; height: 22px; border-radius: 6px; background: rgba(255, 255, 255, 0.12); }
</style>
</head>
<body>
<div class="art">
  <div class="pane today">
    <i class="line" style="top: 10px; width: 30px; background: #efe4ff"></i>
    <i class="line" style="top: 19px; width: 20px"></i>
    <i class="tile" style="top: 30px"><i class="sq" style="position: absolute; left: 5px; top: 4px; background: #e8c06a"></i></i>
    <i class="tile" style="top: 58px"><i class="sq" style="position: absolute; left: 5px; top: 4px; background: #6fd3e0"></i></i>
  </div>
  <div class="fingers">
    <span class="dot" style="left: 0; top: 10px"></span><span class="dot" style="left: 16px; top: 2px"></span>
    <span class="dot" style="left: 32px; top: 0"></span><span class="dot" style="left: 48px; top: 6px"></span>
  </div>
</div>
</body>
</html>
