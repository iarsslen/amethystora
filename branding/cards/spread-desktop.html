<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* Spread for the desktop: three fingers spread apart, and the windows move aside to show the desktop */
.art { --loop: 2.6s; background: linear-gradient(160deg, #3a1f66, #1a1226 70%); }
@keyframes a { 0%, 10% { transform: translate(-5px, -5px); } 46%, 88% { transform: translate(-24px, -18px); } 100% { transform: translate(-5px, -5px); } }
@keyframes b { 0%, 10% { transform: translate(5px, -5px); } 46%, 88% { transform: translate(24px, -18px); } 100% { transform: translate(5px, -5px); } }
@keyframes c { 0%, 10% { transform: translate(0, 6px); } 46%, 88% { transform: translate(0, 26px); } 100% { transform: translate(0, 6px); } }
@keyframes left { 0%, 16% { transform: translateX(0); } 52%, 86% { transform: translateX(-70px); } 100% { transform: translateX(0); } }
@keyframes right { 0%, 16% { transform: translateX(0); } 52%, 86% { transform: translateX(72px); } 100% { transform: translateX(0); } }
.w1 { left: 18px; top: 16px; width: 64px; height: 50px; animation-name: left; }
.w2 { left: 66px; top: 40px; width: 66px; height: 52px; animation-name: right; }
.dot { left: 69px; top: 50px; opacity: 0.95; }
.a { animation-name: a; }
.b { animation-name: b; }
.c { animation-name: c; }
</style>
</head>
<body>
<div class="art">
  <i class="win w1"></i><i class="win w2"></i>
  <span class="dot a"></span><span class="dot b"></span><span class="dot c"></span>
</div>
</body>
</html>
