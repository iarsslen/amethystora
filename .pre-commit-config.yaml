# .pre-commit-config.yaml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
        - id: check-json
        - id: check-toml
        - id: check-yaml
        # A patch's blank context lines are one space, and it must stay byte for byte as git wrote it; so must
        # Notes' test fixtures, which are the files the Electron window wrote
        - id: end-of-file-fixer
          exclude: ^(packaging/.*\.patch|apps/notes/tests/fixtures/.*)$
        - id: trailing-whitespace
          exclude: ^(packaging/.*\.patch|apps/notes/tests/fixtures/.*)$
