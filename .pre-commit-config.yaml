# .pre-commit-config.yaml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
        - id: check-json
        - id: check-toml
        - id: check-yaml
        # A patch's blank context lines are one space, and it must stay byte for byte as git wrote it
        - id: end-of-file-fixer
          exclude: ^packaging/.*\.patch$
        - id: trailing-whitespace
          exclude: ^packaging/.*\.patch$
