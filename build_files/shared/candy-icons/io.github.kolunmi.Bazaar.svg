<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" style="isolation:isolate" viewBox="0 0 48 48" width="48pt" height="48pt">
<!--
  Bazaar in the candy-icons style, installed into the theme by build_files/base/10-icons.sh.

  candy-icons has no Bazaar icon. Its store icon, software-store, is a shopping bag that at dash size
  reads as a folder with an arrow in it, and Warehouse is already drawn with it. Bazaar's own
  artwork is a market stall under a striped awning, so this is that stall drawn the way the pack
  draws: outlines only, no backplate, one horizontal two-stop gradient running from the awning's red
  into a warm orange, and a break in the counter at the right, which is the pack's own signature.
-->
  <linearGradient id="_lgradient_bazaar" x1="0" y1="0.5" x2="1" y2="0.5">
    <stop offset="0%" stop-opacity="1" style="stop-color:rgb(255,98,120)"/>
    <stop offset="100%" stop-opacity="1" style="stop-color:rgb(255,170,90)"/>
  </linearGradient>
  <g fill="none" stroke="url(#_lgradient_bazaar)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10 4 L 38 4 L 43 13 A 4.75 4.75 0 0 1 33.5 13 A 4.75 4.75 0 0 1 24 13 A 4.75 4.75 0 0 1 14.5 13 A 4.75 4.75 0 0 1 5 13 Z M 17 4 L 14.5 13 M 24 4 L 24 13 M 31 4 L 33.5 13"/>
    <path d="M 9.75 18 L 9.75 36 M 38.25 18 L 38.25 36"/>
    <path d="M 43 40 L 43 42 A 3 3 0 0 1 40 45 L 8 45 A 3 3 0 0 1 5 42 L 5 39 A 3 3 0 0 1 8 36 L 40 36"/>
    <path d="M 15 32.5 L 18.5 25.5 L 22 32.5 Z"/>
    <circle cx="30" cy="29" r="3.5"/>
  </g>
</svg>
