<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" style="isolation:isolate" viewBox="0 0 48 48" width="48pt" height="48pt">
<!--
  Security Report in the candy-icons style, installed into the theme by build_files/base/10-icons.sh
  and drawn on by /usr/share/applications/amethystora-security-status.desktop.

  The pack has no icon for this. What it does have is a shield, drawn once and used twice: the same
  outline carries a keyhole in preferences-system-privacy and a pair of arcs in gufw. So the shield
  is that shield, taken unchanged from preferences-system-privacy.svg (candy-icons, GPL-3.0, the same
  pack this file is installed into), down to the rounded break in the ring at the upper left, which
  is the pack's own drawing and not damage.

  Inside it, three bars rather than a tick. `ujust security-status` reports what the machine's
  settings are doing, and that report is often not a clean one; a shield with a tick in it would be
  the icon promising an all-clear before anything had been looked at.

  The gradient is two shades from the amethyst ladder in branding/generate.mjs, the glint on the
  crown running down into the stone, on the diagonal the pack's shields use.
-->
  <linearGradient id="_lgradient_security_status" x1="0.0619" y1="0.1472" x2="0.9904" y2="0.9866" gradientTransform="matrix(36,0,0,46.469,6,0.7)" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-opacity="1" style="stop-color:rgb(179,125,249)"/>
    <stop offset="100%" stop-opacity="1" style="stop-color:rgb(93,26,196)"/>
  </linearGradient>
