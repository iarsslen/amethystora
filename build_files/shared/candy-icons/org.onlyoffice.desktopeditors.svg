<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" style="isolation:isolate" viewBox="0 0 48 48" width="48pt" height="48pt">
<!--
  ONLYOFFICE in the candy-icons style, installed into the theme by build_files/base/10-icons.sh.

  candy-icons has no ONLYOFFICE icon, and its generic applications-office is nothing like the mark:
  three layers stacked one above the other, blue on green on orange. Drawn the way the pack draws a
  brand (see claude.svg beside this one): the brand's silhouette, no backplate, one gradient. The
  brand's identity is its three colours, so the gradient runs up through them, pushed up in
  saturation, from the orange of the bottom layer to the blue of the top one.

  The outline is ONLYOFFICE's mark taken unchanged from simple-icons (CC0-1.0), scaled from their
  24-unit box to the 48-unit one the pack uses. The gradient runs across the bounding box, so it
  does not depend on the scale above it. ONLYOFFICE is a trademark of Ascensio System SIA; this is
  only a themed icon for the ONLYOFFICE Desktop Editors, which the image does not install.
-->
  <linearGradient id="_lgradient_onlyoffice" x1="0.5" y1="1" x2="0.5" y2="0">
    <stop offset="8%" stop-opacity="1" style="stop-color:rgb(255,96,64)"/>
    <stop offset="42%" stop-opacity="1" style="stop-color:rgb(140,214,40)"/>
    <stop offset="78%" stop-opacity="1" style="stop-color:rgb(56,190,255)"/>
  </linearGradient>
