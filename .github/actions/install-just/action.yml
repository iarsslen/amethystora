name: Install Just
description: >-
  Installs a pinned release of just, checked against the SHA-256 pinned beside it, into /usr/local/bin,
  where sudo finds it too. Renovate bumps the version and the checksum together (.github/renovate.json5).

runs:
  using: composite
  steps:
    - name: Install Just
      shell: bash
      env:
        JUST_VERSION: 1.59.0
        JUST_SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
      run: |
        archive="${RUNNER_TEMP}/just.tar.gz"
        curl --fail --retry 3 -sSL -o "${archive}" \
          "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        echo "${JUST_SHA256}  ${archive}" | sha256sum -c -
        sudo tar -xzf "${archive}" -C /usr/local/bin just
        rm -f "${archive}"
        just --version
