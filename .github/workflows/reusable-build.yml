name: Reusable Build and Push
on:
  workflow_call:
    inputs:
      image_flavors:
        description: "JSON string of flavors to build, '[main, nvidia-open]'"
        default: '["main", "nvidia-open"]'
        type: string
      brand_name:
        description: "The Brand Name: amethystora"
        required: true
        default: amethystora
        type: string
      stream_name:
        description: "The Fedora Version: stable, latest, or beta"
        required: true
        type: string
      kernel_pin:
        description: "The full kernel version to pin"
        type: string

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  build_container:
    name: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    continue-on-error: false
    env:
      # Only main publishes and signs: its schedule, its dispatches and the merge queue in front of it, and
      # the beta branch its own stream. Pull requests, and dispatches from any other branch, build and test
      # and publish nothing. The guard is in this file, so a branch can change it in its own copy: only
      # secrets kept in an environment that admits main alone are out of such a branch's reach.
      PUBLISH: >-
        ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
        github.event.merge_group.base_ref == 'refs/heads/main' ||
        (inputs.stream_name == 'beta' && github.ref == 'refs/heads/beta')) }}
    strategy:
      fail-fast: false
      matrix:
        image_flavor: ${{ fromJson(inputs.image_flavors) }}
        base_name: ["${{ inputs.brand_name }}", "${{ inputs.brand_name }}-dx"]
        stream_name: ["${{ inputs.stream_name }}"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          # The rechunker mounts the workspace, .git included
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      - name: Install Just
        uses: ./.github/actions/install-just

      # Before the build, which checks the base, kernel and brew images with it (the Justfile's
      # verify-container), and into /usr/local/bin, where the build, run through sudo, finds it
      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          install-dir: /usr/local/bin
          use-sudo: true

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        shell: bash
        run: |
          IMAGE_NAME="$(just image_name ${{ matrix.base_name }} ${{ matrix.stream_name }} ${{ matrix.image_flavor }})"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        shell: bash
        run: |
          DEFAULT_TAG="$(just generate-default-tag \
                       ${{ matrix.stream_name }} \
                       "1")"
          echo "Default Tag: ${DEFAULT_TAG}"
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: DNF Package Cache Setup
        shell: bash
        id: setup-cache
        env:
          MATRIX_BASE_NAME: ${{ matrix.base_name }}
          MATRIX_STREAM_NAME: ${{ matrix.stream_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          CACHE="$(just setup-cache "${MATRIX_BASE_NAME}" \
                            "${MATRIX_STREAM_NAME}" \
                            "1" \
                            "${GITHUB_EVENT_NAME}")"

          CACHE_NAME="$(echo "${CACHE}" | cut -d' ' -f 1)"
          ALLOW_CACHE_WRITE="$(echo "${CACHE}" | cut -d' ' -f 2)"

          echo "cache_name=${CACHE_NAME}" >> "$GITHUB_OUTPUT"
          echo "allow_cache_write=${ALLOW_CACHE_WRITE}" >> "$GITHUB_OUTPUT"

      - name: Restore DNF package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          CACHE_NAME: ${{ steps.setup-cache.outputs.cache_name }}
        with:
          path: /var/tmp/buildah-cache-*
          key: ${{ runner.os }}-${{ runner.arch }}-buildah-${{ env.CACHE_NAME }}

      - name: Build Image
        id: build-image
        shell: bash
        # No token: the job's can push packages, and nothing in the build needs GitHub's API
        env:
          # What does not publish builds with a throwaway module key (Justfile)
          AKMODS_PRIVKEY: ${{ env.PUBLISH == 'true' && secrets.AKMODS_PRIVKEY || '' }}
        run: |
          if [[ -z "${AKMODS_PRIVKEY}" && "${PUBLISH}" == true ]]; then
            echo "::error::AKMODS_PRIVKEY secret missing: published images need it, or evdi (DisplayLink) will not load with Secure Boot"
            exit 1
          fi
          # The runner's sudo ignores -E: hand the build its key explicitly, as a file rather than on
          # sudo's command line, which every process on the runner can read
          key_file="$(mktemp -p "${RUNNER_TEMP}")"
          trap 'rm -f "${key_file}"' EXIT
          if [[ -n "${AKMODS_PRIVKEY}" ]]; then
            printenv AKMODS_PRIVKEY > "${key_file}"
          fi
          sudo env AKMODS_PRIVKEY_FILE="${key_file}" \
               $(command -v just) repo_organization="${{ github.repository_owner }}" \
                    build-ghcr "${{ matrix.base_name }}" \
                               "${{ matrix.stream_name }}" \
                               "${{ matrix.image_flavor }}" \
                               "${{ inputs.kernel_pin }}"

      # The sealed variant of the stable images (Containerfile.sealed, `just seal`), built from the image
      # just built, before it is rechunked, and published as :stable-sealed beside it. Only the release
      # key, the SECUREBOOT_KEY secret whose certificate is secure-boot.crt, makes a publishable one:
      # pull requests, and every build until that secret and certificate exist, seal with a throwaway key
      # so that the sealing is tested, and publish nothing. Merge queue runs skip it. The sealed images are
      # experimental: a failure here fails a pull request, but never keeps the stable image from publishing.
      - name: Seal Image
        id: seal
        if: inputs.stream_name == 'stable' && github.event_name != 'merge_group'
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          SECUREBOOT_KEY: ${{ env.PUBLISH == 'true' && secrets.SECUREBOOT_KEY || '' }}
        run: |
          # The runner's sudo ignores -E: hand the build its secret explicitly, as a file rather than on
          # sudo's command line, which every process on the runner can read
          key_file="$(mktemp -p "${RUNNER_TEMP}")"
          trap 'rm -f "${key_file}"' EXIT
          if [[ -n "${SECUREBOOT_KEY}" ]]; then
            printenv SECUREBOOT_KEY > "${key_file}"
          fi
          sudo env SECUREBOOT_KEY_FILE="${key_file}" \
               $(command -v just) repo_organization="${{ github.repository_owner }}" \
                    seal "${{ matrix.base_name }}" "${{ matrix.stream_name }}" "${{ matrix.image_flavor }}"
          key="$(sudo podman inspect "localhost/${IMAGE_NAME}:stable-sealed" | jq -r '.[0].Config.Labels["org.amethystora.secure-boot-key"]')"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          if [[ "${key}" != release && "${PUBLISH}" == true ]]; then
            echo "::warning::${IMAGE_NAME}:stable-sealed was sealed with a throwaway key, so it is not published. Run \`just secure-boot-key\` once, commit secure-boot.crt and set the SECUREBOOT_KEY secret."
          fi

      # Published, signed and attested here rather than with the image, so that it leaves the runner's disk
      # before the rechunk needs the room. Tagged like the stable image's tags (stable-sealed,
      # stable-sealed-44.20261004, stable-sealed-20261004), pushed twice for the same reason as below, and
      # with gzip: bootc's composefs backend cannot pull zstd:chunked yet (bootc-dev/bootc#2408). It gets
      # no SBOM of its own: its packages are the image's, but rpm-ostree, bootupd and GRUB, plus systemd-boot.
      - name: Push sealed image to GHCR
        id: push-sealed
        if: steps.seal.outputs.key == 'release' && env.PUBLISH == 'true'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          registry="${IMAGE_REGISTRY,,}"
          printenv GITHUB_TOKEN | sudo podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          printenv GITHUB_TOKEN | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          version="$(sudo podman inspect "localhost/${IMAGE_NAME}:stable-sealed" | jq -r '.[0].Config.Labels["org.opencontainers.image.version"]')"
          digest_file="$PWD/.push-sealed-digest"
          for tag in stable-sealed "stable-sealed-${version}" "stable-sealed-${version:3}"; do
            dest="${registry}/${IMAGE_NAME}:${tag}"
            sudo podman push --compression-format gzip --digestfile "${digest_file}" "localhost/${IMAGE_NAME}:stable-sealed" "${dest}"
            sudo podman push --compression-format gzip --digestfile "${digest_file}" "localhost/${IMAGE_NAME}:stable-sealed" "${dest}"
          done
          digest="$(cat "${digest_file}")"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${registry}/${IMAGE_NAME}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          # Every tag pushed carries the signature machines check
          for tag in stable-sealed "stable-sealed-${version}" "stable-sealed-${version:3}"; do
            cosign verify --key cosign.pub "${registry}/${IMAGE_NAME}:${tag}" > /dev/null
          done

      - name: Attest sealed image
        if: steps.push-sealed.outputs.digest != ''
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-sealed.outputs.digest }}
          push-to-registry: true

      - name: Remove sealed image
        if: always() && steps.seal.outcome != 'skipped'
        shell: bash
        run: |
          sudo podman rmi --ignore "localhost/${IMAGE_NAME}:stable-sealed"
          sudo podman image prune -f

      # https://github.com/actions/cache/issues/1533
      - name: Hack around permission issue caching
        shell: bash
        id: cache-perms
        run: |
          sudo chmod 777 --recursive /var/tmp/buildah-cache-0

      - name: Write new DNF package cache
        if: steps.setup-cache.outputs.allow_cache_write == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          CACHE_NAME: ${{ steps.setup-cache.outputs.cache_name }}
        with:
          path: /var/tmp/buildah-cache-*
          key: ${{ runner.os }}-${{ runner.arch }}-buildah-${{ env.CACHE_NAME }}

      # Syft runs as root, in the job that signs: from its release, checked against the SHA-256 pinned here
      # as just's is, never from an installer script on a tag that can move. Renovate bumps the version and
      # the checksum together (.github/renovate.json5).
      - name: Setup Syft
        id: setup-syft
        if: env.PUBLISH == 'true'
        env:
          SYFT_TAG: v1.54.0
          SYFT_SHA256: 54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860
        run: |
          archive="${RUNNER_TEMP}/syft.tar.gz"
          curl --fail --retry 3 -sSL -o "${archive}" \
            "https://github.com/anchore/syft/releases/download/${SYFT_TAG}/syft_${SYFT_TAG#v}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "${archive}" -C /usr/local/bin syft
          rm -f "${archive}"
          echo "cmd=/usr/local/bin/syft" >> "${GITHUB_OUTPUT}"

      - name: Generate SBOM
        if: env.PUBLISH == 'true'
        id: generate-sbom
        env:
          MATRIX_BASE_NAME: ${{ matrix.base_name }}
          MATRIX_STREAM_NAME: ${{ matrix.stream_name }}
          MATRIX_IMAGE_FLAVOR: ${{ matrix.image_flavor }}
          SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
        run: |
          sudo -E $(command -v just) gen-sbom "${MATRIX_BASE_NAME}" \
                            "${MATRIX_STREAM_NAME}" \
                            "${MATRIX_IMAGE_FLAVOR}" \
                            "${SYFT_CMD}"

      - name: Rechunk Image
        id: rechunk-image
        shell: bash
        run: |
          sudo -E $(command -v just) rechunk "${{ matrix.base_name }}" \
                            "${{ matrix.stream_name }}" \
                            "${{ matrix.image_flavor }}" \
                            "1"

      - name: Load Image into Podman
        id: load-rechunk
        shell: bash
        run: |
          sudo -E $(command -v just) load-rechunk "${{ matrix.base_name }}" \
                            "${{ env.DEFAULT_TAG }}" \
                            "${{ matrix.image_flavor }}"

      - name: Secureboot Check
        id: secureboot
        shell: bash
        run: |
          sudo -E $(command -v just) secureboot "${{ matrix.base_name }}" \
                          "${{ env.DEFAULT_TAG }}" \
                          "${{ matrix.image_flavor }}"

      - name: Generate tags
        id: generate-tags
        shell: bash
        run: |
          alias_tags="$(just generate-build-tags \
                     "${{ matrix.base_name }}" \
                     "${{ matrix.stream_name }}" \
                     "${{ matrix.image_flavor }}" \
                     "${{ inputs.kernel_pin }}" \
                     "1" \
                     "$(podman inspect ${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }} | jq -r '.[].Config.Labels["org.opencontainers.image.version"]')" \
                     "${{ github.event_name }}" \
                     "${{ github.event.number }}")"

          echo "Tags for this Action..."
          echo "$alias_tags"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      # Tag Images
      - name: Tag Images
        shell: bash
        run: |
          set -eoux pipefail
          sudo -E $(command -v just) tag-images "${{ env.IMAGE_NAME }}" \
                          "${{ env.DEFAULT_TAG }}" \
                          "${{ steps.generate-tags.outputs.alias_tags }}"

      # Workaround bug where capital letters in your GitHub username make it impossible to push to GHCR.
      # https://github.com/macbre/push-to-ghcr/issues/12
      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printenv GITHUB_TOKEN | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          printenv GITHUB_TOKEN | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push to GHCR
        id: push
        if: env.PUBLISH == 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 30
          command: |
            set -euox pipefail

            digest_file="$PWD/.push-digest"
            for tag in ${{ steps.generate-tags.outputs.alias_tags }}; do
              dest=${{ steps.registry_case.outputs.lowercase }}/${{ env.IMAGE_NAME }}:${tag}
              sudo -E podman push --digestfile "${digest_file}" ${{ env.IMAGE_NAME }}:${tag} "${dest}"
              # We need to push twice to workaround https://github.com/containers/podman/issues/27796
              # If we don't do this then the digest changes and we are only signing this specific tag
              sudo -E podman push --digestfile "${digest_file}" ${{ env.IMAGE_NAME }}:${tag} "${dest}"
            done

            digest="$(cat "${digest_file}")"
            echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Sign container image
        if: env.PUBLISH == 'true'
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${{ steps.registry_case.outputs.lowercase }}/${{ env.IMAGE_NAME }}@${TAGS}
        env:
          TAGS: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      - name: Install ORAS
        if: env.PUBLISH == 'true'
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Login to GitHub Container Registry with ORAS
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printenv GITHUB_TOKEN | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Upload SBOM
        if: env.PUBLISH == 'true'
        id: upload-sbom
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          SBOM="sbom_out/${IMAGE_NAME}/sbom.json"

          cd "$(dirname "${SBOM}")"
          oras attach \
            --artifact-type application/vnd.spdx+json \
            --annotation filename=$(basename "$SBOM") \
            "${IMAGE}@${DIGEST}" \
            "$(basename ${SBOM})"

          sbom_digest=$(oras discover --format json "${IMAGE}@${DIGEST}" | jq -r '.referrers[] | select(.artifactType == "application/vnd.spdx+json") | .digest')

          echo "sbom_digest=${sbom_digest}" >> $GITHUB_OUTPUT

      - name: Sign SBOM OCI Artifact
        if: env.PUBLISH == 'true'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          LOWERCASE: ${{ steps.registry_case.outputs.lowercase }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SBOM_DIGEST: ${{ steps.upload-sbom.outputs.sbom_digest }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${LOWERCASE}/${IMAGE_NAME}@${SBOM_DIGEST}

      - name: Attestation
        if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Every tag pushed above has to carry the signature machines check updates against. A run stopped
      # or failed between the push and the signature would otherwise leave a tag that no machine
      # accepts, and nothing would say so
      - name: Verify the published tags
        if: always() && env.PUBLISH == 'true' && steps.push.outcome != 'skipped'
        env:
          REGISTRY: ${{ steps.registry_case.outputs.lowercase }}
          ALIAS_TAGS: ${{ steps.generate-tags.outputs.alias_tags }}
        run: |
          for tag in ${ALIAS_TAGS}; do
            cosign verify --key cosign.pub "${REGISTRY}/${IMAGE_NAME}:${tag}" > /dev/null
          done

  check:
    name: Check all ${{ matrix.stream_name }} builds successful
    if: always()
    runs-on: ubuntu-latest
    needs: [build_container]
    steps:
      - name: Check Jobs
        env:
          JOBS: ${{ toJson(needs) }}
        run: |
          echo "Job status:"
          echo $JOBS | jq -r 'to_entries[] | " - \(.key): \(.value.result)"'

          for i in $(echo $JOBS | jq -r 'to_entries[] | .value.result'); do
            if [ "$i" != "success" ] && [ "$i" != "skipped" ]; then
              echo ""
              echo "Status check not okay!"
              exit 1
            fi
          done
