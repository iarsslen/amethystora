name: Build ISO
on:
  pull_request:
    branches:
      - main
    paths:
      - "iso/**"
      - ".github/workflows/build-iso.yml"
  workflow_call:
    inputs:
      image:
        description: "The image the ISO installs: amethystora or amethystora-dx"
        type: string
        default: amethystora
  workflow_dispatch:
    inputs:
      image:
        description: "The image the ISO installs"
        type: choice
        default: amethystora
        options:
          - amethystora
          - amethystora-dx

# The installer ISO of a published stable image, built with bootc-image-builder and uploaded to
# Cloudflare R2, which GitHub cannot host: a Release asset is limited to 2 GiB. Each upload replaces
# the last one under the same name, so the download link never changes. Only amethystora and
# amethystora-dx have an ISO; the NVIDIA images have none. Pull requests only build amethystora's.
#
# amethystora also gets a live ISO (the live-iso job), the one the website offers first: it boots into
# Amethystora, which can be tried without installing anything, and installs from there. Named
# amethystora.iso, for https://download.amethystora.org/amethystora.iso; the installer ISOs keep their
# names (amethystora-stable.iso, amethystora-dx-stable.iso).
#
# Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (an R2 API token with Object Read
# & Write on the bucket), R2_BUCKET, and SIGNING_SECRET, which signs the checksum as it signs the image.

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-iso-${{ inputs.image || 'amethystora' }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: ISO
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      IMAGE: ${{ inputs.image || 'amethystora' }}
      ISO: ${{ inputs.image || 'amethystora' }}-stable.iso

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare the installer configuration
        run: |
          case "${IMAGE}" in
            amethystora|amethystora-dx) ;;
            *) echo "::error::${IMAGE} has no ISO: only amethystora and amethystora-dx do"; exit 1 ;;
          esac
          sed -i "s|@IMAGE@|${IMAGE}|" iso/iso.toml

      # bootc-image-builder chooses the installer's packages by the image's os-release ID and has no
      # definition for amethystora, so Fedora's is written out under that name before it starts, with
      # two packages added: generic-logos and generic-release. Fedora's trademark guidelines ask a
      # system built from Fedora to leave fedora-logos and fedora-release out. The list names neither,
      # so Fedora's would arrive as dependencies; asked for by name, the generic ones conflict with
      # them and take their place. That needs the builder's container run by hand: its GitHub action
      # cannot add to it. The storage configuration is the action's own fix,
      # https://github.com/osbuild/bootc-image-builder/issues/446
      #
      # The builder is pinned to its build of June 2026, the last that reads its definitions from that
      # folder. Its successor, which `latest` is due to become, has them compiled in, so moving to it
      # means rewriting this step.
      #
      # The builder will not start without the installed system's root filesystem type, which the
      # image does not declare in /usr/lib/bootc/install. It only writes it into a kickstart of its
      # own, and iso.toml brings one, so Anaconda still lays out the disk; btrfs is what it chooses.
      #
      # Ubuntu, from 25.10, confines /usr/bin/bwrap, in a container as well, with its
      # bwrap-userns-restrict profile, which denies every capability to whatever bwrap starts.
      # osbuild runs each stage under bwrap, so its stages could neither chown nor mount; the profile
      # is unloaded before the builder starts.
      - name: Build ISO
        env:
          BUILDER: quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b
          IMAGE_REF: ghcr.io/iarsslen/${{ env.IMAGE }}:stable
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' |
            sudo tee /etc/containers/storage.conf > /dev/null
          if [[ -e /etc/apparmor.d/bwrap-userns-restrict ]]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo podman pull "${BUILDER}"
          sudo podman pull "${IMAGE_REF}"
          mkdir output
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume ./output:/output \
            --volume ./iso/iso.toml:/config.toml:ro \
            --entrypoint /bin/bash "${BUILDER}" -c '
              set -euo pipefail
              cd /usr/share/bootc-image-builder/defs
              for def in fedora-*.yaml; do
                { cat "${def}"; printf "    - generic-logos\n    - generic-release\n"; } > "amethystora-${def#fedora-}"
              done
              exec bootc-image-builder "$@"' bash \
            build --output /output --type anaconda-iso --rootfs btrfs --use-librepo=True \
              --chown "$(id -u):$(id -g)" "${IMAGE_REF}"

      # What the installer is made of, from the manifest the builder leaves beside the ISO, for the ISO
      # to carry. This fails, before anything is uploaded, if Fedora's logo or release package is in
      # the installer after all.
      - name: List the installer's packages
        run: |
          python3 iso/installer-packages.py output/manifest-anaconda-iso.json > INSTALLER-PACKAGES

      # Anaconda is installed from Fedora's packages and looks like Fedora's until it finds a
      # product.img in the images/ directory of the install media, which it lays over its own root
      # before it starts. iso/product is the Amethystora one, drawn by branding/generate.mjs.
      - name: Brand the installer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio isomd5sum xorriso
          (cd iso/product && find . -mindepth 1 | LC_ALL=C sort | cpio --quiet -o -H newc -R 0:0 | gzip -9) > product.img
          mkdir upload
          # replay keeps the boot records bootc-image-builder wrote: BIOS, UEFI and the hybrid MBR/GPT.
          # LICENSE, NOTICE and the installer's package list go beside the installer: NOTICE names what
          # the ISO redistributes and carries the written offer for its source, which has to reach
          # whoever receives the ISO
          xorriso -indev output/bootiso/install.iso -outdev "upload/${ISO}" -boot_image any replay \
            -map product.img /images/product.img -map LICENSE /LICENSE -map NOTICE /NOTICE \
            -map INSTALLER-PACKAGES /INSTALLER-PACKAGES
          # "Test this media" checks the image against the checksum implanted in it, which adding the
          # file has invalidated
          implantisomd5 --force "upload/${ISO}"

      - name: Checksum
        working-directory: upload
        run: |
          sha256sum "${ISO}" | tee "${ISO}.sha256"

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign checksum
        if: github.event_name != 'pull_request'
        working-directory: upload
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign-blob -y --key env://COSIGN_PRIVATE_KEY --bundle "${ISO}.sha256.bundle" "${ISO}.sha256"

      - name: Upload to Cloudflare R2
        if: github.event_name != 'pull_request'
        working-directory: upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # As Cloudflare advises for AWS CLI 2.23 and later, whose default checksums R2 has refused
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [[ -z "${R2_ACCOUNT_ID}" || -z "${R2_BUCKET}" || -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "::error::The R2 secrets are not set, so the ISO cannot be uploaded"
            exit 1
          fi
          # The ISO first, so that the checksum is never replaced before the ISO it describes
          for file in "${ISO}" "${ISO}.sha256" "${ISO}.sha256.bundle"; do
            aws s3 cp --no-progress \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              "${file}" "s3://${R2_BUCKET}/${file}"
          done

  # The live ISO of amethystora: boot it from a USB stick, try Amethystora without installing anything,
  # and install it from there with Anaconda, offline. Titanoboa (ublue-os/titanoboa, Apache-2.0) squashes
  # a live system into a UEFI-only ISO; the live system is the published image with the live boot, the
  # live session and the installer added (iso/live), and a copy of the image itself, which is what gets
  # installed. Titanoboa is pinned to its first commit that takes nothing but that image: everything else
  # is in the image. Its trick for the offline copy, an image store in /usr/lib/containers/storage, does
  # not work with Fedora 45's podman 6 (ublue-os/titanoboa#151), which this job will need an answer to
  # before the stable image moves to 45.
  live-iso:
    name: Live ISO
    if: (inputs.image || 'amethystora') == 'amethystora'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      IMAGE_REF: ghcr.io/iarsslen/amethystora:stable
      ISO: amethystora.iso

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # Everything on the ISO is the published image, so it is checked first against the key every update
      # is checked against
      - name: Verify the image
        run: |
          cosign verify --key cosign.pub "${IMAGE_REF}" > /dev/null

      # sys_admin and no SELinux label for the build, which pulls the image into the live system's own
      # image store and rebuilds its initramfs
      - name: Build the live system
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' |
            sudo tee /etc/containers/storage.conf > /dev/null
          sudo podman pull "${IMAGE_REF}"
          sudo podman build --cap-add sys_admin --security-opt label=disable \
            --build-arg BASE_IMAGE="${IMAGE_REF}" --tag localhost/amethystora-live:stable \
            --file iso/live/Containerfile iso

      - name: Build ISO
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/amethystora-live:stable
          iso-dest: ${{ github.workspace }}/output/live.iso

      # What the live system is made of, for the ISO to carry beside NOTICE, whose written offer covers
      # it. Fedora's trademark guidelines keep its logo and release packages out of a system built from
      # Fedora, as they are kept out of the image and the installer ISO: this fails before the upload if
      # the live session's packages brought one back.
      - name: List the live system's packages
        run: |
          sudo podman run --rm --entrypoint rpm localhost/amethystora-live:stable \
            -qa --queryformat '%{NAME}\t%{VERSION}-%{RELEASE}\t%{LICENSE}\n' | sort > LIVE-PACKAGES
          if awk -F'\t' '$1 == "fedora-logos" || $1 ~ /^fedora-release/ { found = 1 } END { exit !found }' LIVE-PACKAGES; then
            echo "::error::The live system carries Fedora's logo or release package"
            exit 1
          fi

      - name: Add the licences
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso
          mkdir upload
          # replay keeps the boot records Titanoboa wrote
          xorriso -indev output/live.iso -outdev "upload/${ISO}" -boot_image any replay \
            -map LICENSE /LICENSE -map NOTICE /NOTICE -map LIVE-PACKAGES /LIVE-PACKAGES

      - name: Checksum
        working-directory: upload
        run: |
          sha256sum "${ISO}" | tee "${ISO}.sha256"

      - name: Sign checksum
        if: github.event_name != 'pull_request'
        working-directory: upload
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign-blob -y --key env://COSIGN_PRIVATE_KEY --bundle "${ISO}.sha256.bundle" "${ISO}.sha256"

      - name: Upload to Cloudflare R2
        if: github.event_name != 'pull_request'
        working-directory: upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [[ -z "${R2_ACCOUNT_ID}" || -z "${R2_BUCKET}" || -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "::error::The R2 secrets are not set, so the ISO cannot be uploaded"
            exit 1
          fi
          # The ISO first, so that the checksum is never replaced before the ISO it describes
          for file in "${ISO}" "${ISO}.sha256" "${ISO}.sha256.bundle"; do
            aws s3 cp --no-progress \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              "${file}" "s3://${R2_BUCKET}/${file}"
          done
