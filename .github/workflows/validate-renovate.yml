name: Validate Renovate Config

on:
  pull_request:
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/validate-renovate.yml"
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/validate-renovate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Renovate's own image, pinned by digest and kept current by Renovate
      # (renovate.json5), rather than whatever npm resolves renovate to
      - name: Validate Renovate config
        shell: bash
        env:
          RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.138.0@sha256:32027ed5e5e450f76ee372fcd6e72c8114db7fdb28c97c520515a03ea4a0d77b
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$RENOVATE_IMAGE" renovate-config-validator --strict
