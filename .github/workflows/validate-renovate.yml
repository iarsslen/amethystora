name: Validate Renovate Config

on:
  pull_request:
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/validate-renovate.yml"
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/validate-renovate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Renovate's own image, pinned by digest and kept current by Renovate
      # (renovate.json5), rather than whatever npm resolves renovate to
      - name: Validate Renovate config
        shell: bash
        env:
          RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.198.2@sha256:4132c8c1b0051ade1429c2e5f439569b361b4527216a1c184ff4ba58a2d1fd7e
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$RENOVATE_IMAGE" renovate-config-validator --strict
